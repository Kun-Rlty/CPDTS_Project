# CPDTS production reverse-proxy template (nginx).
#
# This is a deployment template, not an executed local configuration. Replace
# placeholders and review it for the target host. Do not commit real domains,
# certificate paths, tokens or private keys.
#
# Contract:
#   * HTTPS is the only public origin; HTTP redirects to HTTPS.
#   * The SPA build (frontend/dist) is served from the same origin as /api.
#   * /api/ is always proxied to the private backend. API 404s/errors are never
#     replaced by index.html.
#   * Unknown non-asset paths fall back to index.html for SPA deep links;
#     missing build assets return 404.
#   * Client-supplied Forwarded / X-Forwarded-* values are overwritten, and a
#     boundary token is added. The backend rejects forwarded headers without it.
#   * Only /actuator/health is proxied; other actuator paths are blocked.
#
# Tested locally with the equivalent scripts/https_proxy.mjs contract. This
# nginx file is provided for the actual hosting step and has not been executed
# on the development machine (nginx is not installed there).

upstream cpdts_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name <cpdts.example.com>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <cpdts.example.com>;

    ssl_certificate     /etc/cpdts/tls/fullchain.pem;
    ssl_certificate_key /etc/cpdts/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CPDTS_TLS:10m;
    ssl_session_timeout 1h;

    root /var/www/cpdts;
    index index.html;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Generated by the deployment process from the same random value given to
    # the backend as CPDTS_PROXY_TOKEN. Keep mode 0600. Example:
    #   set $cpdts_proxy_token "<random value>";
    include /etc/cpdts/proxy-token.conf;

    # Exact /api is an API path, never a SPA route.
    location = /api {
        default_type application/json;
        return 404 '{"error":"not_found","message":"Unknown API endpoint"}';
    }

    location /api/ {
        proxy_pass http://cpdts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-CPDTS-Proxy-Token $cpdts_proxy_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://cpdts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-CPDTS-Proxy-Token $cpdts_proxy_token;
        access_log off;
    }

    location = /actuator {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    location /actuator/ {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # Hashed build assets are immutable; a missing asset is an error, not a
    # SPA route.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Any other file-like path must exist; otherwise 404 instead of index.html.
    location ~* \.(?:js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|txt|json|webmanifest)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA deep links and the application shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
