# CPDTS test configuration.
#
# This file REPLACES the main application.properties on the test classpath.
# The datasource URL is HARD-PINNED to the scratch test database so automated
# tests can never touch cpdts_dev or any other database, even when
# CPDTS_DB_URL points elsewhere in the shell environment.
#
# The password still comes ONLY from the environment (loaded from the local
# .env.backend by the developer/CI - never committed, never printed).

spring.datasource.url=jdbc:postgresql://localhost:5432/cpdts_test
spring.datasource.username=${CPDTS_DB_USER:postgres}
spring.datasource.password=${CPDTS_DB_PASSWORD}

# Flyway applies pending migrations (e.g. V6) to the test database on startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.connect-retries=3
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=false
