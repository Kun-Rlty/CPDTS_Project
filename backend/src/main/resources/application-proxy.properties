# HTTPS reverse-proxy deployment profile.
#
# Activate with SPRING_PROFILES_ACTIVE=proxy. Local HTTP development keeps the
# defaults in application.properties (non-secure cookie, no forwarded-header
# handling), so the two configurations never share unsafe defaults.
#
# The application is private: it listens only on loopback and is reached by the
# reverse proxy on the same host. Never expose this port on a public interface.

server.address=127.0.0.1

# Trust X-Forwarded-* only from the loopback reverse proxy. The proxy also has
# to present the boundary token configured below; see TrustedProxyHeadersFilter.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127.0.0.1/32,::1/128
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.port-header=X-Forwarded-Port

# Secure same-origin session cookie. __Host- requires Secure, Path=/ and no
# Domain; SameSite=Lax supports top-level navigation and refresh while the SPA
# and API share one origin. CSRF protection is unchanged.
server.servlet.session.cookie.name=__Host-CPDTS_SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Shared boundary token. The reverse proxy overwrites any client-supplied
# forwarded headers and adds this token. Startup fails if the variable is absent.
cpdts.proxy.token=${CPDTS_PROXY_TOKEN}
