# CPDTS backend - minimal foundation configuration.
#
# Database connection comes ONLY from environment variables (never committed,
# never printed). These are the SAME names scripts\run_db.ps1 injects for the
# Flyway Maven CLI, read from your local .env.backend:
#   CPDTS_DB_URL       e.g. jdbc:postgresql://localhost:5432/cpdts_dev
#   CPDTS_DB_USER      database role
#   CPDTS_DB_PASSWORD  database password (local only - required, no default)

spring.application.name=cpdts-backend
server.port=8080

spring.datasource.url=${CPDTS_DB_URL:jdbc:postgresql://localhost:5432/cpdts_dev}
spring.datasource.username=${CPDTS_DB_USER}
spring.datasource.password=${CPDTS_DB_PASSWORD}

# Flyway is an explicit operator-run step using separate migration credentials.
# Runtime checks the history read-only; operators must validate checksums before startup.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.connect-retries=3
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Authentication foundation (PROVISIONAL decisions - see task report):
#   * Server-side HTTP sessions (session strategy is still an open decision in
#     docs/TECHNICAL_REQUIREMENTS.md section 14; sessions are the reversible
#     default until that decision is finalized).
#   * CSRF protection stores the token in the HTTP session; clients call
#     GET /api/v1/auth/csrf once, then send the token in the X-XSRF-TOKEN
#     request header on POST/PUT/PATCH/DELETE.
#   * Session timeout 30 minutes (provisional; refresh/revocation strategy is
#     required before production per TECHNICAL_REQUIREMENTS.md).
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Production behind HTTPS must set CPDTS_SESSION_SECURE=true (local HTTP dev: false).
server.servlet.session.cookie.secure=${CPDTS_SESSION_SECURE:false}

# ---------------------------------------------------------------------------
# Login-abuse throttling (PROTOTYPE DEFAULTS - temporary cooldown only, never
# a permanent lockout). A failed sign-in counts against BOTH the normalized
# account key and the trusted client address (the connection's remote address;
# rewritten only by Tomcat's RemoteIpValve for the internal proxy, and spoofed
# forwarded headers are rejected by TrustedProxyHeadersFilter). Once a key
# reaches its threshold, further attempts get HTTP 429 + Retry-After until the
# oldest failures age out (cooldown-seconds); a successful sign-in clears both
# keys. Attempts rejected during a cooldown are not recorded, so hammering
# cannot extend someone's cooldown.
#
#   account-failures  failures per account before cooldown   (default 5)
#   ip-failures       failures per client address            (default 20)
#   cooldown-seconds  cooldown length / stale-entry expiry   (default 300)
#   max-entries       bounded key capacity, fail-open        (default 10000)
#
# Override per environment with SPRING_APPLICATION_JSON or -D flags, e.g.
#   -Dcpdts.login-throttle.account-failures=8
# (Avoid guessing relaxed-binding env-var names for dashed properties.)
#
# LIMITATION: state is in-memory and per JVM instance. Counters are not shared
# between replicas and reset on restart; a multi-instance deployment needs a
# shared store (out of scope for the prototype).
# ---------------------------------------------------------------------------
cpdts.login-throttle.account-failures=5
cpdts.login-throttle.ip-failures=20
cpdts.login-throttle.cooldown-seconds=300
cpdts.login-throttle.max-entries=10000

# Health check remains the only non-auth endpoint in this phase.
management.endpoints.web.exposure.include=health
