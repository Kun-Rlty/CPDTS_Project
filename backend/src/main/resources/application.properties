# CPDTS backend - minimal foundation configuration.
#
# Database connection comes ONLY from environment variables (never committed,
# never printed). These are the SAME names scripts\run_db.ps1 injects for the
# Flyway Maven CLI, read from your local .env.backend:
#   CPDTS_DB_URL       e.g. jdbc:postgresql://localhost:5432/cpdts_dev
#   CPDTS_DB_USER      database role
#   CPDTS_DB_PASSWORD  database password (local only - required, no default)

spring.application.name=cpdts-backend
server.port=8080

spring.datasource.url=${CPDTS_DB_URL:jdbc:postgresql://localhost:5432/cpdts_dev}
spring.datasource.username=${CPDTS_DB_USER:postgres}
spring.datasource.password=${CPDTS_DB_PASSWORD}

# Flyway: identical migrations and history table as the Maven CLI configuration.
# On an already-migrated database this only VALIDATES the applied versions;
# it never recreates data (no baseline, no out-of-order, no clean).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.connect-retries=3
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Authentication foundation (PROVISIONAL decisions - see task report):
#   * Server-side HTTP sessions (session strategy is still an open decision in
#     docs/TECHNICAL_REQUIREMENTS.md section 14; sessions are the reversible
#     default until that decision is finalized).
#   * CSRF protection stores the token in the HTTP session; clients call
#     GET /api/v1/auth/csrf once, then send the token in the X-XSRF-TOKEN
#     request header on POST/PUT/PATCH/DELETE.
#   * Session timeout 30 minutes (provisional; refresh/revocation strategy is
#     required before production per TECHNICAL_REQUIREMENTS.md).
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Production behind HTTPS must set CPDTS_SESSION_SECURE=true (local HTTP dev: false).
server.servlet.session.cookie.secure=${CPDTS_SESSION_SECURE:false}

# Health check remains the only non-auth endpoint in this phase.
management.endpoints.web.exposure.include=health
